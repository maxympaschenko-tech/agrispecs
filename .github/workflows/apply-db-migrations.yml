name: Apply database migrations

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: farm-machine-specs-db-migrations
  cancel-in-progress: true

jobs:
  apply-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Wait for Hostinger auto deployment
        run: sleep 90

      - name: Apply repository-defined migrations
        shell: bash
        run: |
          set -u
          endpoint="https://farmmachinespecs.com/api/internal/apply-migrations"

          for attempt in {1..10}; do
            echo "Migration attempt ${attempt}/10"
            response="$(curl --fail --silent --show-error --max-time 25 "$endpoint" 2>/dev/null || true)"
            echo "$response"

            if printf '%s' "$response" | grep -q '"ok":true'; then
              echo "Database migrations applied successfully."
              exit 0
            fi

            sleep 20
          done

          echo "Migration endpoint did not report success after retries."
          exit 1
